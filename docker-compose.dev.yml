services:
  # GraphDB Service (same for dev)
  graphdb:
    image: ontotext/graphdb:10.5.0
    container_name: skillmex-graphdb-dev
    environment:
      GDB_HEAP_SIZE: 2g
      GDB_JAVA_OPTS: >-
        -Xms1g -Xmx2g
        -Dgraphdb.home=/opt/graphdb/home
        -Dgraphdb.workbench.cors.enable=true
    volumes:
      - graphdb-data-dev:/opt/graphdb/home
    ports:
      - "7200:7200"
    networks:
      - skillmex-network-dev

  # Backend Service (development mode)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend-build
    container_name: skillmex-backend-dev
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: ${PORT:-9090}
      GRAPHDB_URL: ${GRAPHDB_URL:-http://graphdb:7200}
      GRAPHDB_REPOSITORY: ${GRAPHDB_REPOSITORY:-test-repo}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/app/backend/uploaded-files}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # OPC UA Configuration
      OPCUA_SERVER_URL: ${OPCUA_SERVER_URL:-}
      OPCUA_USERNAME: ${OPCUA_USERNAME:-}
      OPCUA_PASSWORD: ${OPCUA_PASSWORD:-}
      # Camunda Configuration
      CAMUNDA_URL: ${CAMUNDA_URL:-http://camunda:8080/engine-rest}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
    volumes:
      # Mount source code for hot reload
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./tsconfig.base.json:/app/tsconfig.base.json
      # Exclude node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
      # Persist uploaded files
      - uploaded-files-dev:/app/backend/uploaded-files
    ports:
      - "9090:9090"
      - "9229:9229" # Debug port
    networks:
      - skillmex-network-dev
    depends_on:
      - graphdb

  # Frontend Service (development mode)
  frontend:
    image: node:16.15.0-alpine
    container_name: skillmex-frontend-dev
    working_dir: /app/frontend
    command: npm run start:dev
    environment:
      NODE_ENV: development
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - ./tsconfig.base.json:/app/tsconfig.base.json
      # Exclude node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
    ports:
      - "4200:4200"
    networks:
      - skillmex-network-dev
    depends_on:
      - backend

  # Optional: Camunda Service
  # camunda:
  #   image: camunda/camunda-bpm-platform:7.19.0
  #   container_name: skillmex-camunda-dev
  #   environment:
  #     DB_DRIVER: org.h2.Driver
  #     DB_URL: jdbc:h2:./camunda-h2-dbs/process-engine;MVCC=TRUE;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE
  #     DB_USERNAME: sa
  #     DB_PASSWORD: sa
  #     WAIT_FOR: ""
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - skillmex-network-dev

networks:
  skillmex-network-dev:
    driver: bridge

volumes:
  graphdb-data-dev:
    driver: local
  uploaded-files-dev:
    driver: local