<div class="card mb-3">
    <div class="card-header">
        <div class="row align-items-center">
            <div class="col-8">
                <h5 class="d-inline" title="{{capability.iri}}">{{capability.getLocalName()}}</h5>
            </div>
            <div class="col-4">
                <div class="float-end">
                    <button class="btn btn-sm me-1" [class]="copyButtonClass"
                    #copyToolTip
                    data-bs-toggle="tooltip"
                    data-bs-trigger="hover"
                    data-bs-placement="top"
                    data-bs-title="Copy to clipboard"
                    (click)="copyIRI()">
                        <i class="text-success-subtle" [class]="clipBoardClass"></i>
                    </button>
                    <a
                    #editToolTip
                    data-bs-toggle="tooltip"
                    data-bs-trigger="hover"
                    data-bs-placement="top"
                    data-bs-title="Edit capability info"
                    class="btn btn-sm btn-secondary me-1"
                    [routerLink]="[ '/capability-editor', capability.iri ]">
                        <i class="fa fa-pencil"></i>
                    </a>
                    <a
                    #graphVisuToolTip
                    data-bs-toggle="tooltip"
                    data-bs-trigger="hover"
                    data-bs-placement="top"
                    data-bs-title="Show in Graph View"
                    class="btn btn-sm btn-secondary me-1"  [routerLink]="[ '/graph-visualization/capabilities', capability.iri]">
                        <i class="fa fa-project-diagram"></i>
                    </a>
                    <button
                    #deleteCapToolTip
                    data-bs-toggle="tooltip"
                    data-bs-trigger="hover"
                    data-bs-placement="top"
                    data-bs-title="Delete Capability"
                    class="btn btn-sm btn-danger"
                    (click)="deleteCapability()"><i class="far fa-trash-alt"></i></button>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="row align-items-center">
            <div class="col-3">
                <b>Capability Type:</b>
            </div>
            <div class="col-6 d-flex gap-2 align-items-center">
                <span>
                    {{capability.capabilityType.getLocalName()}}
                </span>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-3">
                <b>Inputs:</b>
                <ul>
                    <li *ngFor="let capInput of capability.inputs">{{capInput.getLocalName()}}</li>
                </ul>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <b>Outputs:</b>
                <ul>
                    <li *ngFor="let capOutput of capability.outputs">{{capOutput.getLocalName()}}</li>
                </ul>
            </div>
        </div>

        <b *ngIf="capability.skills.length > 0" class="mt-2">Skills:</b>
        <ng-container *ngFor="let skill of capability.skills">
            <skill-card [skill]="skill"></skill-card>
        </ng-container>

    </div>
</div>
