<h3>Ontology registration</h3>
<p>Add {{this.context}} through an automated mapping or manually.</p>

<div class="row">
    <div class="col">
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="options" id="manualOntology" [value]="'manualOntology'"
                [(ngModel)]="ontologyType">Ontology (.ttl file)
            <label class="form-check-label" for="manualOntology"></label>
        </div>

        <div class="form-check form-check-inline">
            <label class="form-check-label ps-3 " for="naturalLanguage">
                <input class="form-check-input" type="radio" name="options" id="naturalLanguage" [value]="'naturalLanguage'" [(ngModel)]="ontologyType">
                From natural language
            </label>
        </div>

        <div class="form-check form-check-inline">
            <label class="form-check-label ps-3" for="mtp">
                <input class="form-check-input" type="radio" name="options" id="mtp" [value]="'mtp'" [(ngModel)]="ontologyType">
                Mapping from MTP
            </label>
        </div>

        <div class="form-check form-check-inline">
            <label class="form-check-label ps-3" for="plc">
                <input class="form-check-input" type="radio" name="options" id="plc" [value]="'plc'" [(ngModel)]="ontologyType">
                Mapping from PLC code
            </label>
        </div>

    </div>
</div>

<llm-generation *ngIf="ontologyType=='naturalLanguage'" [context]="context"></llm-generation>
<mtp-mapping *ngIf="ontologyType=='mtp'" [context]="context"></mtp-mapping>
<plc-mapping *ngIf="ontologyType=='plc'" [context]="context"></plc-mapping>
<manual-registration *ngIf="ontologyType=='manualOntology'" [context]="context"></manual-registration>
